name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write # purge superseded Nix caches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      # Keep the Nix store between runs, so unchanged packages are not rebuilt.
      # Only main saves: a cache saved from another branch is not shared and
      # would crowd main's out of the repository's cache quota. Purging is
      # main-only too: Dependabot's runs have a read-only token.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never
      - name: Test bootstrap safety
        run: |
          nix develop --command python3 -B -m unittest discover -s tests -v
          nix develop --command ruff check --isolated --select F,E9 scripts tests modules/fzf-rg
          nix develop --command nixfmt --check flake.nix modules/home.nix scripts/maintenance.nix
          bash -n uninstall.sh install.sh scripts/prerequisites.sh
          nix develop --command shellcheck uninstall.sh install.sh scripts/prerequisites.sh modules/fzf-preview modules/shell/common.sh modules/shell/macos.sh modules/shell/bash.sh modules/shell/ble-start.sh modules/shell/ble-finish.sh
      - name: Build example home without activation
        run: nix flake check
      - name: Build uninstall and keep-tools plans without activation
        run: nix develop --command python3 -B tests/check_maintenance_build.py
