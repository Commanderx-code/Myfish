name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write # purge superseded Nix caches
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
      # Keep the Nix store between runs, so unchanged packages are not rebuilt.
      # Only main saves: a cache saved from another branch is not shared and
      # would crowd main's out of the repository's cache quota.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never
      - name: Test bootstrap safety
        run: |
          nix develop --command python3 -B -m unittest discover -s tests -v
          bash -n uninstall.sh install.sh scripts/prerequisites.sh
          nix develop --command shellcheck uninstall.sh install.sh scripts/prerequisites.sh modules/fzf-preview modules/shell/common.sh modules/shell/macos.sh modules/shell/bash.sh modules/shell/ble-start.sh modules/shell/ble-finish.sh
      - name: Build example home without activation
        run: nix flake check
      - name: Build uninstall and keep-tools plans without activation
        run: nix develop --command python3 -B tests/check_maintenance_build.py
