# Colours are named, so the layout stays the same whatever the palette:
# `palette` picks one of the [palettes.*] tables at the end. Dotfiles imports
# this file and swaps in the palette chosen with its `rice` command.
palette = "eldritch"

format = """
[╭─](bg:user fg:prompt_text)\
$python\
$username\
[](bg:directory fg:user)\
$directory\
[](fg:directory bg:git)\
$git_branch\
$git_status\
[](fg:git bg:language)\
$c\
$golang\
$java\
$rust\
[](fg:language bg:docker)\
$docker_context\
[](fg:docker bg:time)\
$time\
[](fg:time)
[╰─>](bg:user fg:prompt_text)\
$character\
$status\
$package
"""

command_timeout = 1200

[username]
show_always = true
style_user = "bg:user fg:prompt_text"
style_root = "bg:user fg:alert"
format = "[$user ]($style)"

[character]
error_symbol = " [×](bold red) "
success_symbol = " [λ](green bold) "

# The character module shows a red × after an unsuccessful command.
# Keep detailed exit codes and pipeline labels out of the prompt.
[status]
disabled = true

[directory]
style = "bg:directory fg:prompt_text"
read_only = ""
read_only_style = "bg:directory fg:alert bold"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
format = "[ in $path ]($style)[$read_only]($read_only_style)"


[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[time]
disabled = false
time_format = " %I:%M %p"
style = "bg:time fg:prompt_text"
format = "[ $time ]($style)"

[git_branch]
symbol = " "
style = "bg:user fg:prompt_text"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:git fg:prompt_text"
format = "[$all_status$ahead_behind ]($style)"
conflicted = ""
ahead = "↑"
behind = "↓"
diverged = "↕"
untracked = "?"
stashed = ""
modified = "!"
staged = "+"
renamed = "»"
deleted = "×"

[c]
symbol = " "
style = "bg:language fg:prompt_dark"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = "󰟓 "
style = "bg:language fg:prompt_dark"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:language fg:prompt_dark"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = " "
style = "bg:language fg:prompt_dark"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:user fg:prompt_text"
format = "[ $symbol$version (\\($virtualenv\\)) ]($style) "

[docker_context]
symbol = " "
style = "bg:docker fg:prompt_dark"
format = "[ $symbol$context ]($style) "

[package]
symbol = "󰏗 "

# Eldritch (https://github.com/eldritch-theme), mapped onto the prompt's segments.
[palettes.eldritch]
prompt_text = "#ebfafa"
prompt_dark = "#212337"
alert = "#f16c75"
user = "#292e42"
directory = "#3b4261"
git = "#171928"
language = "#a48cf2"
docker = "#04d1f9"
time = "#9071f4"
