# Colours are named, so the layout stays the same whatever the palette:
# `palette` picks one of the [palettes.*] tables at the end. Dotfiles imports
# this file and swaps in the palette chosen with its `rice` command.
palette = "eldritch"

format = """
$os\
$python\
$username\
$nix_shell\
${env_var.NVIM}\
${env_var.YAZI_LEVEL}\
$shlvl\
[](bg:directory fg:user)\
$directory\
[](fg:directory bg:git)\
$git_branch\
$git_status\
$git_state\
[](fg:git bg:language)\
$c\
$golang\
$java\
$rust\
$package\
[](fg:language bg:docker)\
$docker_context\
[](fg:docker bg:time)\
$time\
[](fg:time)
$character\
$status
"""

command_timeout = 1200

# The operating system's logo opens the bar. The glyphs are Nerd Font private-use
# characters, written as escapes so that any editor shows them as intended.
[os]
disabled = false
style = "bg:user fg:prompt_text"
format = "[$symbol ]($style)"

[os.symbols]
Arch = "\uf303"
Garuda = "\uf303"
Macos = "\uf302"
Ubuntu = "\uf31b"
Debian = "\uf306"
Fedora = "\uf30a"
NixOS = "\uf313"
Linux = "\uf17c"

[username]
show_always = true
style_user = "bg:user fg:prompt_text"
style_root = "bg:user fg:alert"
format = "[$user]($style)"

# Subshell markers sit beside the username and show only inside one: a Nix
# shell by name, a shell opened from Neovim or Yazi, and how deep any other
# nested shell is. `exit` there leaves the subshell, not the terminal.
[nix_shell]
symbol = " "
style = "bg:user fg:docker"
heuristic = false
format = "[ $symbol$name]($style)"

[env_var.NVIM]
style = "bg:user fg:docker"
format = "[ nvim]($style)"

[env_var.YAZI_LEVEL]
style = "bg:user fg:docker"
format = "[ yazi]($style)"

[shlvl]
disabled = false
threshold = 2
symbol = "↕"
style = "bg:user fg:docker bold"
format = "[ $symbol$shlvl]($style)"

# A green ❯ after success, a red × after an unsuccessful command.
[character]
error_symbol = "[×](bold red) "
success_symbol = "[❯](green bold) "

# Keep detailed exit codes and pipeline labels out of the prompt.
[status]
disabled = true

[directory]
style = "bg:directory fg:prompt_text"
read_only = ""
read_only_style = "bg:directory fg:alert bold"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
format = "[ in $path ]($style)[$read_only]($read_only_style)"


[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[time]
disabled = false
time_format = " %I:%M %p"
style = "bg:time fg:prompt_text"
format = "[ $time ]($style)"

[git_branch]
symbol = " "
style = "bg:git fg:prompt_dark"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:git fg:prompt_dark"
format = "[$all_status$ahead_behind ]($style)"
conflicted = ""
ahead = "↑"
behind = "↓"
diverged = "↕"
untracked = "?"
stashed = ""
modified = "!"
staged = "+"
renamed = "»"
deleted = "×"

# Shown only mid-operation: REBASING 2/5, MERGING, CHERRY-PICKING…
[git_state]
style = "bg:git fg:prompt_dark bold"
format = "[$state( $progress_current/$progress_total) ]($style)"

[c]
symbol = " "
style = "bg:language fg:prompt_dark"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = "󰟓 "
style = "bg:language fg:prompt_dark"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:language fg:prompt_dark"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = " "
style = "bg:language fg:prompt_dark"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:user fg:prompt_text"
format = "[$symbol $version( \\($virtualenv\\)) ]($style)"

[docker_context]
symbol = " "
style = "bg:docker fg:prompt_dark"
format = "[ $symbol$context ]($style)"

[package]
symbol = "󰏗 "
style = "bg:language fg:prompt_dark"
format = "[ $symbol$version ]($style)"

# Eldritch (https://github.com/eldritch-theme), mapped onto the prompt's segments.
[palettes.eldritch]
prompt_text = "#ebfafa"
prompt_dark = "#212337"
alert = "#f16c75"
user = "#292e42"
directory = "#3b4261"
git = "#7081d0"
language = "#a48cf2"
docker = "#04d1f9"
time = "#9071f4"
